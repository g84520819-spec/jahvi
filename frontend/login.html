<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jahvi - Log in</title>
<style>
  :root { --ink:#0a0d12; --paper:#fbf8f3; --ember:#ff5a36; --dim:rgba(251,248,243,.66); --danger:#ff6b6b; }
  * { box-sizing:border-box; }
  body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--ink); color:var(--paper); font-family:Inter,system-ui,sans-serif; }
  main { width:min(100%,420px); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:34px; color:var(--paper); font:600 22px Georgia,serif; }
  .brand img { width:32px; height:32px; border-radius:9px; object-fit:cover; }
  .eyebrow { color:var(--ember); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  h1 { margin:10px 0 8px; font:500 clamp(2.2rem,8vw,3.2rem) Georgia,serif; }
  .intro { margin:0 0 28px; color:var(--dim); line-height:1.6; }
  form { display:grid; gap:18px; }
  label { display:grid; gap:8px; color:var(--dim); font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
  input { width:100%; padding:14px; border:1px solid rgba(251,248,243,.18); border-radius:10px; background:rgba(255,255,255,.05); color:var(--paper); font:inherit; }
  input:focus { outline:2px solid rgba(255,90,54,.45); border-color:var(--ember); }
  button { margin-top:4px; padding:14px; border:0; border-radius:999px; background:var(--ember); color:#160800; cursor:pointer; font:700 15px inherit; }
  button:disabled { cursor:not-allowed; opacity:.6; }
  .error { display:none; margin:0; padding:11px 12px; border:1px solid rgba(255,107,107,.35); border-radius:9px; background:rgba(255,107,107,.08); color:var(--danger); font-size:13px; }
  .error.visible { display:block; }
  .footer { margin-top:24px; color:var(--dim); font-size:13px; text-align:center; }
  a { color:var(--ember); font-weight:700; text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <a class="brand" href="index.html"><img src="clipForge.png" alt="ClipForge logo" />Jahvi</a>
  <span class="eyebrow">Welcome back</span>
  <h1>Log in</h1>
  <p class="intro">Use your email and password to continue to Jahvi.</p>
  <form id="login-form" novalidate>
    <label for="email">Email address
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
    </label>
    <label for="password">Password
      <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required />
    </label>
    <p id="form-error" class="error" role="alert" aria-live="polite"></p>
    <button id="submit-button" type="submit">Log in</button>
  </form>
  <p class="footer">New to Jahvi? <a href="signup.html">Create an account</a></p>
</main>
<script src="api_config.js"></script>
<script>

const form = document.getElementById("login-form");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const errorBox = document.getElementById("form-error");
const submitButton = document.getElementById("submit-button");
const apiBaseUrl = window.JAHVI_API_BASE_URL;

function showError(message) {
  errorBox.textContent = message;
  errorBox.classList.add("visible");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  errorBox.classList.remove("visible");
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showError("Enter a valid email address.");
    return;
  }
  if (!password) {
    showError("Enter your password.");
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "Logging in...";
  try {
    const result = await fetch(`${apiBaseUrl}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password }),
    });
    const data = await result.json().catch(() => null);
    if (!result.ok) {
      const detail = data && data.detail;
      showError(typeof detail === "string" ? detail : "Email or password is incorrect.");
      return;
    }
    localStorage.setItem("jahvi_user", JSON.stringify(data.user));
    window.location.href = "dashboard.html";
  } catch (error) {
    showError(`Could not reach the signup server at ${apiBaseUrl}. Make sure port 8000 is public and the backend is running.`);
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Log in";
  }
});
</script>
</body>
</html>
