<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jahvi — My Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="app-shell">
  <main class="main">
    <header class="topbar">
      <a class="topbar-logo jobs-brand" href="dashboard.html">
        <img src="clipForge.png" alt="" class="logo-img">
        <span class="topbar-logo-text">Jahvi</span>
      </a>
      <div class="greeting">
        <div class="greeting-eyebrow">Processing queue</div>
        <div class="greeting-name" id="userName">My jobs</div>
      </div>
      <div class="avatar" id="userAvatar" aria-label="Your account">--</div>
      <a class="jobs-nav" href="dashboard.html">Dashboard</a>
      <button type="button" class="logout topbar-logout">Log out</button>
    </header>

    <section class="jobs-page" aria-labelledby="jobsTitle">
      <div class="jobs-page-heading">
        <div>
          <h1 id="jobsTitle">My video jobs</h1>
          <p>Queue position and processing status update automatically.</p>
        </div>
        <button type="button" class="jobs-refresh" id="refreshJobsBtn" aria-label="Refresh jobs" title="Refresh jobs">↻</button>
      </div>
      <p id="jobsStatus" class="jobs-status" role="status" aria-live="polite">Loading jobs…</p>
      <div class="jobs-list" id="jobsList"></div>
    </section>
  </main>
</div>
<script src="api_config.js"></script>
<script src="auth_ui.js"></script>
<script src="my_videos.js"></script>
</body>
</html>
